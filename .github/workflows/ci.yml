name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --filter @clippy/web test
      - run: pnpm --filter @clippy/web type-check
      - run: pnpm --filter @clippy/web build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clippy/web exec playwright install chromium
      - name: Run E2E tests
        run: pnpm --filter @clippy/web exec playwright test
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://useclippy.com' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
